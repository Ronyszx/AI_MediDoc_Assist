spring:
  application:
    name: mediassist-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediassist}
    username: ${DB_USERNAME:mediassist}
    password: ${DB_PASSWORD:mediassist}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

mediassist:
  storage:
    documents-root: ${DOCUMENT_STORAGE_ROOT:./storage/documents}
    allowed-extensions:
      - pdf
    allowed-content-types:
      - application/pdf
  extraction:
    paragraph-drop-threshold: ${PDF_PARAGRAPH_DROP_THRESHOLD:3.0}
  chunking:
    max-chunk-size: ${DOCUMENT_CHUNK_MAX_SIZE:1000}
    overlap-size: ${DOCUMENT_CHUNK_OVERLAP_SIZE:150}
  embedding:
    endpoint-url: ${EMBEDDING_SERVICE_URL:http://localhost:8001/api/v1/embeddings}
    model-name: ${EMBEDDING_MODEL_NAME:BAAI/bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    batch-size: ${EMBEDDING_BATCH_SIZE:32}
  qa:
    evidence:
      enabled: ${QA_EVIDENCE_ENABLED:false}
      batch-selection-enabled: ${QA_EVIDENCE_BATCH_SELECTION_ENABLED:false}
      selection-batch-size: ${QA_EVIDENCE_SELECTION_BATCH_SIZE:8}
      max-items: ${QA_EVIDENCE_MAX_ITEMS:12}
      max-passages: ${QA_EVIDENCE_MAX_PASSAGES:80}
      max-passage-characters: ${QA_EVIDENCE_MAX_PASSAGE_CHARACTERS:1200}
      max-answer-characters: ${QA_EVIDENCE_MAX_ANSWER_CHARACTERS:6000}
    retrieval:
      diversity-enabled: ${QA_RETRIEVAL_DIVERSITY_ENABLED:false}
      candidate-count: ${QA_RETRIEVAL_CANDIDATE_COUNT:20}
      relevance-weight: ${QA_RETRIEVAL_RELEVANCE_WEIGHT:0.7}
    facets:
      enabled: ${QA_FACET_RETRIEVAL_ENABLED:false}
      max-facets: ${QA_MAX_FACETS:6}
      original-candidate-count: ${QA_ORIGINAL_CANDIDATE_COUNT:20}
      facet-candidate-count: ${QA_FACET_CANDIDATE_COUNT:10}
      fusion-constant: ${QA_FUSION_CONSTANT:60}
      nomination-rank-limit: ${QA_NOMINATION_RANK_LIMIT:3}
      max-evidence-tokens: ${QA_MAX_EVIDENCE_TOKENS:4000}
      planner-output-tokens: ${QA_PLANNER_OUTPUT_TOKENS:512}
  llm:
    provider: ${LLM_PROVIDER:ollama}
    endpoint-url: ${LLM_SERVICE_URL:http://localhost:11434/api/chat}
    model-name: ${LLM_MODEL_NAME:qwen3.5:4b}
    temperature: ${LLM_TEMPERATURE:0.2}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:800}
    context-window-tokens: ${LLM_CONTEXT_WINDOW_TOKENS:8192}
    connect-timeout: ${LLM_CONNECT_TIMEOUT:5s}
    read-timeout: ${LLM_READ_TIMEOUT:120s}
